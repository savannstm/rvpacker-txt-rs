[package]
name = "rvpacker-txt-rs"
version = "16.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["wrap_help", "cargo", "derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
    "tracing",
] }
encoding_rs = "0.8.35"
gxhash = { version = "3.5.0", features = ["deterministic"] }
rpgmad-lib = "5.0.1"
rvpacker-lib = { package = "rvpacker-txt-rs-lib", version = "16.2.0", features = [
    "serde-csv",
    "serde-xml",
    "serde-xlsx",
    "serde-yaml",
] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
strum = { version = "0.28.0", features = ["strum_macros"] }
tracing-subscriber = "0.3.23"

[profile.release]
lto = "fat"
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.release.build-override]
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
strip = "symbols"
